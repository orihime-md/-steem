services:
  - type: web
    name: steem-clan-platform
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: steem-postgres
          property: connectionString
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_USERNAME
        value: veil_sovereign
      - key: SESSION_SECRET
        generateValue: true

databases:
  - name: steem-postgres
    databaseName: steem_db
    user: steem_user
    plan: free
